# Consulta diaria a la base (sin datos: el acceso anónimo no ve nada) para que el plan gratuito
# de Supabase no pause el proyecto por inactividad (lo pausa tras 7 días sin actividad).
name: Mantener activo Supabase
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: sb_publishable_CLYuajCg_s7EcEQDBkKyNQ__j2Wg_t3" \
            "https://uvodcmmehtghkbwadzlq.supabase.co/rest/v1/rfcs?select=id&limit=1"
