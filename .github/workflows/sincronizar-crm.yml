# Sincroniza la copia del CRM en Supabase cada 30 minutos (solo LEE el CRM: Zoho hoy, Salesforce después).
# Queda APAGADA hasta que exista la conexión: se enciende creando la variable del repositorio
#   CRM_FUENTE = zoho        (o salesforce cuando migren)
# y el secreto GV_ADMIN_TOKEN (token de administración). Las credenciales del CRM viven en Supabase, no aquí.
name: Sincronizar CRM
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  sincronizar:
    if: ${{ vars.CRM_FUENTE == 'zoho' || vars.CRM_FUENTE == 'salesforce' }}
    runs-on: ubuntu-latest
    steps:
      - name: Leer el CRM y actualizar la copia
        env:
          TOKEN: ${{ secrets.GV_ADMIN_TOKEN }}
          FUENTE: ${{ vars.CRM_FUENTE }}
        run: |
          codigo=$(curl -s -o respuesta.json -w "%{http_code}" -X POST \
            -H "content-type: application/json" -H "x-gv-admin: $TOKEN" \
            -d "{\"fuente\":\"$FUENTE\"}" \
            "https://uvodcmmehtghkbwadzlq.supabase.co/functions/v1/crm-sync")
          echo "HTTP $codigo"; cat respuesta.json; echo
          test "$codigo" = "200"
